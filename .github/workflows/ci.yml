name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    # Pinned (not ubuntu-latest) so a runner-image upgrade can't silently change native libs.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONFAULTHANDLER: "1"   # a native crash prints a Python traceback instead of just 139
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cpu,dev]"
          # Runners have no display/libGL: swap in the headless OpenCV build.
          pip uninstall -y opencv-python
          pip install opencv-python-headless
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        # -v names each test, so a crash points at the test that caused it.
        # Tests that need weights, datasets, a camera or a GPU skip themselves (tests/conftest.py).
        run: pytest -v -rs
      - name: Environment report
        run: python scripts/check_env.py
